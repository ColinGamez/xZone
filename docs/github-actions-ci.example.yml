name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: xzone/package-lock.json

      - name: Install
        working-directory: xzone
        run: npm ci

      - name: Validate
        working-directory: xzone
        run: npm run validate

